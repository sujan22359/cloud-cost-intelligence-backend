# Alembic configuration file

[alembic]
script_location = alembic
# NOTE: This url is a LOCAL DEVELOPMENT FALLBACK ONLY.
# In production and CI/CD, alembic/env.py overrides this with the DATABASE_URL environment variable.
# Set DATABASE_URL=postgresql+psycopg://user:password@host:5432/dbname in your .env or deployment secrets.
sqlalchemy.url = postgresql+psycopg://postgres:postgres123@localhost:5432/costdb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

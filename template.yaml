AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Cost Intelligence Backend (FastAPI + Lambda + S3 Event-Driven ETL)

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 1024
    Timeout: 120
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        # AWS Secrets Manager Secret Identifier
        SECRET_NAME: !Ref SecretName

        # AWS Bedrock (AWS_REGION is automatically injected by AWS Lambda runtime)
        BEDROCK_REGION: !Ref BedrockRegion
        BEDROCK_MODEL_ID: !Ref BedrockModelId

        # S3 Bucket
        S3_BUCKET_NAME: !Ref S3BucketName
        AWS_S3_BUCKET: !Ref S3BucketName

Parameters:
  SecretName:
    Type: String
    Default: cloud-cost-intelligence
    Description: Name or ARN of AWS Secrets Manager secret containing database and auth credentials

  S3BucketName:
    Type: String
    Default: awscost359
    Description: Existing Amazon S3 bucket name containing billing CSV reports

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: AWS Bedrock Region

  BedrockModelId:
    Type: String
    Default: arn:aws:bedrock:us-east-1:706244676568:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Amazon Bedrock Claude Model ID

Resources:
  # ── 1. FastAPI Web Backend Lambda Function ──────────────────────────────────
  # Least Privilege: Execution + Bedrock permissions + Secrets Manager GetSecretValue.
  FastApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloud-cost-intelligence-api
      CodeUri: ./
      Handler: app.main.handler
      Description: FastAPI API Gateway Handler for Cloud Cost Intelligence Assistant
      Timeout: 120
      Events:
        Root:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"

  # ── 2. Event-Driven ETL Lambda Function ───────────────────────────────────
  # Least Privilege: Execution + S3 permissions + Secrets Manager GetSecretValue.
  EtlSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloud-cost-intelligence-etl-sync
      CodeUri: ./
      Handler: app.scheduler.sync_lambda.sync_handler
      Description: S3 Event-Driven ETL Lambda for processing monthly billing CSVs
      Timeout: 300
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${S3BucketName}
                - !Sub arn:aws:s3:::${S3BucketName}/*

  # ── 3. S3 Permission for Event Notification Trigger ─────────────────────────
  EtlSyncFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EtlSyncFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${S3BucketName}

Outputs:
  ApiEndpoint:
    Description: API Gateway Endpoint URL for FastAPI Backend
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  FastApiFunctionArn:
    Description: FastAPI Lambda Function ARN
    Value: !GetAtt FastApiFunction.Arn

  EtlSyncFunctionArn:
    Description: Event-Driven ETL Lambda Function ARN
    Value: !GetAtt EtlSyncFunction.Arn